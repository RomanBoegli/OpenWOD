name: Check
# Lint, typecheck, build and the browser suite (paused with BROWSER_SUITE below). Runs on every branch push and pull request, and as the validation step of the
# Release image workflow when the tagged commit has no green run of its own. Tags themselves do not trigger it.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  # The browser suite is paused for now: set to "true" to run it again on every push and inside the release.
  BROWSER_SUITE: "false"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run browsers:install -- --with-deps
        if: env.BROWSER_SUITE == 'true'
      - run: npm run test:e2e
        if: env.BROWSER_SUITE == 'true'
      - uses: actions/upload-artifact@v7
        if: env.BROWSER_SUITE == 'true' && failure()
        with:
          name: browser-test-results
          path: test-results/
