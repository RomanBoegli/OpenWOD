name: Release image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      checked: ${{ steps.previous.outputs.checked }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match package.json
        if: github.ref_type == 'tag'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; fi
          test -f "docs/releases/$GITHUB_REF_NAME.md" || { echo "docs/releases/$GITHUB_REF_NAME.md is missing"; exit 1; }
      # A commit that already passed the Check workflow is not tested again: the release chains onto that run.
      - name: Look for a green Check of this commit
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')"
          if [ "$runs" -gt 0 ]; then echo "Check already passed for $GITHUB_SHA"; echo "checked=true" >> "$GITHUB_OUTPUT"; else echo "No green Check for $GITHUB_SHA yet: running it here"; echo "checked=false" >> "$GITHUB_OUTPUT"; fi
  check:
    needs: validate
    if: needs.validate.outputs.checked != 'true'
    uses: ./.github/workflows/check.yml
  image:
    needs: [validate, check]
    # The skipped Check of an already-checked commit counts as passed; anything else stops the release.
    if: always() && needs.validate.result == 'success' && (needs.check.result == 'success' || needs.check.result == 'skipped')
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned like the arm64 runner: ubuntu-latest moved on to a newer image in October 2026.
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache production test browsers
        uses: actions/cache@v6
        with:
          path: .cache/ms-playwright
          key: browsers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/@playwright/test/package.json') }}
      # Bounded: the apt step inside --with-deps twice hung on a slow Ubuntu mirror until the 40-minute job timeout.
      # A re-run lands on another runner with another mirror, so the step fails fast instead of retrying on the same one.
      - name: Install production test browsers
        timeout-minutes: 10
        run: npm run browsers:install -- --with-deps
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
      - name: Start candidate container
        id: candidate
        env:
          CANDIDATE: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ matrix.architecture }}
        run: docker run --detach --name openwod-smoke -p 127.0.0.1:8080:8080 "$CANDIDATE"
      - name: Wait for candidate readiness
        run: |
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8080/api/v1/health/ready; then break; fi
            sleep 1
          done
          curl --fail --show-error --max-time 5 http://127.0.0.1:8080/api/v1/health/ready
          curl --fail --show-error --max-time 5 http://127.0.0.1:8080/
      - name: Test candidate image in Chromium, Firefox and WebKit
        env:
          OPENWOD_PRODUCTION_URL: http://127.0.0.1:8080
        run: npm run test:production
      - name: Push tested candidate image
        env:
          CANDIDATE: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ matrix.architecture }}
        run: |
          docker push "$CANDIDATE"
      - name: Upload production browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-browser-results-${{ matrix.architecture }}
          path: test-results-production/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show failed candidate logs
        if: failure() && steps.candidate.outcome == 'success'
        run: docker logs openwod-smoke
      - name: Remove candidate container
        if: always() && steps.candidate.outcome == 'success'
        run: docker rm --force openwod-smoke
  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="sha-${REVISION}"
          if [ "$REF_TYPE" = tag ]; then version="$REF"; fi
          if docker manifest inspect "$image:$version" > /dev/null 2>&1; then
            echo "Refusing to overwrite an existing release tag: $version"
            exit 1
          fi
          docker buildx imagetools create --tag "$image:$version" "$image:candidate-$REVISION-amd64" "$image:candidate-$REVISION-arm64"
          digest="$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          {
            echo "## Published $image:$version"
            echo
            echo "Digest: \`$digest\`"
            echo
            echo "Pin it in the stack: \`APP_IMAGE=$image@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
