name: Release image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run browsers:install -- --with-deps
      - run: npm run test:e2e
  image:
    needs: validate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ matrix.architecture }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
      - name: Smoke test image
        env:
          CANDIDATE: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ matrix.architecture }}
        run: |
          docker run --detach --name openwod-smoke -p 8080:8080 "$CANDIDATE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/v1/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8080/api/v1/health/ready
          curl --fail http://localhost:8080/
          docker push "$CANDIDATE"
  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="sha-${REVISION}"
          if [ "$REF_TYPE" = tag ]; then version="$REF"; fi
          if docker manifest inspect "$image:$version" > /dev/null 2>&1; then
            echo "Refusing to overwrite an existing release tag: $version"
            exit 1
          fi
          docker buildx imagetools create --tag "$image:$version" "$image:candidate-$REVISION-amd64" "$image:candidate-$REVISION-arm64"
