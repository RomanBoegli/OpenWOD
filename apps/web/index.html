<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101714" />
    <meta name="description" content="OpenWOD. Not born. Made. A workout player for training at home, solo or in pairs." />
    <title>OpenWOD — Not born. Made.</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash. Mirrors apps/web/src/theme.ts.
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('openwod.theme') || localStorage.getItem('wodva.theme');
          theme = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        } catch (error) { theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#101613' : '#f3f5ee');
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
