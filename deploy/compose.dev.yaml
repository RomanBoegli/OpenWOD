name: openwod-preview

services:
  openwod:
    build:
      context: ..
    image: openwod:local
    container_name: openwod-preview
    init: true
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/app.sqlite}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - openwod-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.env.NODE_TLS_REJECT_UNAUTHORIZED='0';fetch((process.env.HTTPS_CERT?'https':'http')+'://127.0.0.1:8080/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

volumes:
  openwod-data:
