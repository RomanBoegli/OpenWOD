format: wodva.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: back-squat-5x5
  revision: 1
  title: Back squat 5 × 5
  description: Five sets of five at a weight you could lift for seven. Tap Done after each set; the two-minute rest starts on its own and the next set waits for you.
  attribution:
    author: Wodva
    notes: Percentages are of a recent one-rep max; the levels are conservative, moderate and demanding.
  equipment:
    - Barbell
    - Squat rack
  participants: 1
  prep: 10s
  sections:
    - id: bs
      title: Back squat
      format: strength
      transitionAfter: manualReady
      body:
        id: bs-sets
        type: repeat
        count: 5
        betweenIterationsRest: 2m
        body:
          id: bs-set
          type: task
          assignments:
            A:
              name: Back squat
              reps: 5
              load:
                light:
                  value: 65
                  unit: percent
                medium:
                  value: 75
                  unit: percent
                heavy:
                  value: 85
                  unit: percent
