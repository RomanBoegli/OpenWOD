format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: fran
  revision: 1
  title: Fran
  description: Thrusters and pull-ups, 21-15-9, as fast as you can. Tap Done after each set; the clock counts up and stops when you finish or at ten minutes.
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/benchmark/fran
    notes: Follows the published benchmark. Heavy is the published men’s Rx (95 lb), medium the women’s Rx (65 lb), light the published beginner load (45 lb), rounded to kilograms.
  equipment:
    - Barbell
    - Pull-up bar
  participants: 1
  prep: 10s
  sections:
    - id: fran-for-time
      title: 21-15-9
      format: forTime
      transitionAfter: manualReady
      cap: 10m
      body:
        id: fran-ladder
        type: sequence
        children:
          - id: fran-thrusters-21
            type: task
            assignments:
              A:
                name: Thrusters
                reps: 21
                load:
                  light:
                    value: 20
                    unit: kg
                  medium:
                    value: 30
                    unit: kg
                  heavy:
                    value: 43
                    unit: kg
          - id: fran-pull-ups-21
            type: task
            assignments:
              A:
                name: Pull-ups
                reps: 21
          - id: fran-thrusters-15
            type: task
            assignments:
              A:
                name: Thrusters
                reps: 15
                load:
                  light:
                    value: 20
                    unit: kg
                  medium:
                    value: 30
                    unit: kg
                  heavy:
                    value: 43
                    unit: kg
          - id: fran-pull-ups-15
            type: task
            assignments:
              A:
                name: Pull-ups
                reps: 15
          - id: fran-thrusters-9
            type: task
            assignments:
              A:
                name: Thrusters
                reps: 9
                load:
                  light:
                    value: 20
                    unit: kg
                  medium:
                    value: 30
                    unit: kg
                  heavy:
                    value: 43
                    unit: kg
          - id: fran-pull-ups-9
            type: task
            assignments:
              A:
                name: Pull-ups
                reps: 9
