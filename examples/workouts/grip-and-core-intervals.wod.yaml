format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: grip-and-core-intervals
  revision: 1
  title: Grip & core intervals
  description: Ten intervals of 45 seconds on and 20 seconds off, alternating a plate pinch hold with a kettlebell suitcase carry. Hold the plates or hang from the bar for the whole interval; on the carry, stand tall and switch hands halfway.
  attribution:
    author: Coach programming, shared in a members chat
    notes: Curated from a CrossFit class program; loads are training suggestions with light/medium/heavy levels added by Wodva.
  equipment:
    - Plates
    - Kettlebell
  participants: 1
  prep: 10s
  sections:
    - id: grip
      title: Grip & core
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: grip-rounds
        type: repeat
        count: 5
        betweenIterationsRest: 20s
        body:
          id: grip-pair
          type: sequence
          betweenChildrenRest: 20s
          children:
            - id: grip-pinch
              type: timed
              duration: 45s
              assignments:
                A:
                  notes: Or a dead hang from the bar
                  name: Plate pinch hold
            - id: grip-carry
              type: timed
              duration: 45s
              assignments:
                A:
                  notes: Switch hands halfway
                  name: Kettlebell suitcase carry
                  shortName: Suitcase carry
