format: wodva.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: hyrox-engine-emom-24
  revision: 1
  title: HYROX engine EMOM 24
  description: "Every minute for 24 minutes: a hard minute of running, a minute on the next station, a minute of wall balls. Eight cycles cover all eight stations. Keep moving for the full minute; the next one starts whether you are ready or not."
  attribution:
    author: Wodva
    sourceUrl: https://hyrox.com/the-fitness-race/
    notes: "A training variation of the published HYROX race structure (8 runs, 8 stations). Timed intervals replace race distances and loads; nothing here is an official prescription. Swap stations you lack: a heavy carry for the sled, a treadmill or shuttle for the run."
  equipment:
    - Treadmill or running route
    - SkiErg
    - Sled
    - Rowing machine
    - Kettlebells
    - Sandbag
    - Medicine ball
  participants: 1
  prep: 10s
  sections:
