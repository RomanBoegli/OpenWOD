format: wodva.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: pull-and-press-ladder
  revision: 1
  title: Pull & press ladder
  description: "Three rungs, twelve-minute cap: 15-12-9 pull-ups, shoulder-to-overhead and hang cleans, then 12-9-6 with chest-to-bar and a heavier bar, then 9-6-3 with bar muscle-ups and the heaviest bar. The minute of rest after each rung is timed for you. Change plates during the rest."
  attribution:
    author: Coach programming, shared in a members chat
    notes: Curated from a CrossFit class program; loads are training suggestions with light/medium/heavy levels added by Wodva.
  equipment:
    - Pull-up bar
    - Barbell
  participants: 1
  prep: 10s
  sections:
    - id: ladder-ft
      title: Ladder
      format: forTime
      transitionAfter: manualReady
      cap: 12m
      body:
        id: ladder-ft-rungs
        type: sequence
        children:
          - id: ladder-ft-pull-ups
            type: task
            assignments:
              A:
                name: Pull-ups
                reps: 15
          - id: ladder-ft-s2oh-1
            type: task
            assignments:
              A:
                name: Shoulder-to-overhead
                shortName: S2OH
                reps: 12
                load:
                  light:
                    value: 30
                    unit: kg
                  medium:
                    value: 43
                    unit: kg
                  heavy:
                    value: 60
                    unit: kg
          - id: ladder-ft-hang-cleans-1
            type: task
            assignments:
              A:
                name: Hang cleans
                reps: 9
                load:
                  light:
                    value: 30
                    unit: kg
                  medium:
                    value: 43
                    unit: kg
                  heavy:
                    value: 60
                    unit: kg
          - id: ladder-ft-rest-1
            type: rest
            duration: 1m
            kind: blockRest
          - id: ladder-ft-c2b
            type: task
            assignments:
              A:
                name: Chest-to-bar pull-ups
                shortName: C2B pull-ups
                reps: 12
          - id: ladder-ft-s2oh-2
            type: task
            assignments:
              A:
                name: Shoulder-to-overhead
                shortName: S2OH
                reps: 9
                load:
                  light:
                    value: 35
                    unit: kg
                  medium:
                    value: 50
                    unit: kg
                  heavy:
                    value: 70
                    unit: kg
          - id: ladder-ft-hang-cleans-2
            type: task
            assignments:
              A:
                name: Hang cleans
                reps: 6
                load:
                  light:
                    value: 35
                    unit: kg
                  medium:
                    value: 50
                    unit: kg
                  heavy:
                    value: 70
                    unit: kg
          - id: ladder-ft-rest-2
            type: rest
            duration: 1m
            kind: blockRest
          - id: ladder-ft-muscle-ups
            type: task
            assignments:
              A:
                name: Bar muscle-ups
                reps: 9
          - id: ladder-ft-s2oh-3
            type: task
            assignments:
              A:
                name: Shoulder-to-overhead
                shortName: S2OH
                reps: 6
                load:
                  light:
                    value: 40
                    unit: kg
                  medium:
                    value: 60
                    unit: kg
                  heavy:
                    value: 85
                    unit: kg
          - id: ladder-ft-hang-cleans-3
            type: task
            assignments:
              A:
                name: Hang cleans
                reps: 3
                load:
                  light:
                    value: 40
                    unit: kg
                  medium:
                    value: 60
                    unit: kg
                  heavy:
                    value: 85
                    unit: kg
