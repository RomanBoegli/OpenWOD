format: wodva.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: rack-and-run-amrap-25
  revision: 1
  title: Rack & Run AMRAP 25
  description: "Twenty-five minutes: row, then five of everything on one barbell, then a minute of rest before the next round. The rest is part of the round, so take it by your own watch and go again. Pick a bar you can clean unbroken when tired."
  attribution:
    author: Coach programming, shared in a members chat
    notes: Curated from a CrossFit class program; loads are training suggestions with light/medium/heavy levels added by Wodva.
  equipment:
    - Rowing machine
    - Barbell
  participants: 1
  prep: 10s
  sections:
    - id: rack-run
      title: AMRAP 25
      format: amrap
      transitionAfter: manualReady
      cap: 25m
      counter: roundsAndReps
      body:
        id: rack-run-round
        type: sequence
        children:
          - id: rack-run-row
            type: task
            assignments:
              A:
                notes: 500 m if scaling
                name: Row
                distance:
                  value: 600
                  unit: m
          - id: rack-run-burpees-1
            type: task
            assignments:
              A:
                name: Burpees over bar
                reps: 5
          - id: rack-run-deadlifts
            type: task
            assignments:
              A:
                notes: "Program: 50–60 kg men, 35–42.5 kg women; one bar for all lifts"
                name: Deadlifts
                reps: 5
                load:
                  light:
                    value: 25
                    unit: kg
                  medium:
                    value: 40
                    unit: kg
                  heavy:
                    value: 55
                    unit: kg
          - id: rack-run-cleans
            type: task
            assignments:
              A:
                name: Cleans
                reps: 5
                load:
                  light:
                    value: 25
                    unit: kg
                  medium:
                    value: 40
                    unit: kg
                  heavy:
                    value: 55
                    unit: kg
          - id: rack-run-s2oh
            type: task
            assignments:
              A:
                name: Shoulder-to-overhead
                shortName: S2OH
                reps: 5
                load:
                  light:
                    value: 25
                    unit: kg
                  medium:
                    value: 40
                    unit: kg
                  heavy:
                    value: 55
                    unit: kg
          - id: rack-run-burpees-2
            type: task
            assignments:
              A:
                name: Burpees over bar
                reps: 5
          - id: rack-run-rest
            type: task
            assignments:
              A:
                notes: One minute by your own watch, then start the next round
                name: Rest
                time: 1m
