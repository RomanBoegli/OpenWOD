format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: ski-skip-muscle-up-rounds
  revision: 1
  title: Ski, skip, muscle-up × 3
  description: "Three rounds for time: 250 metres on the SkiErg, fifty double-unders, five bar muscle-ups. Short and sharp, so ski hard and keep the rope relaxed. Scale the muscle-ups to chest-to-bar or jumping muscle-ups."
  attribution:
    author: Coach programming, shared in a members chat
    notes: Curated from a CrossFit class program; loads are training suggestions with light/medium/heavy levels added by Wodva.
  equipment:
    - SkiErg
    - Jump rope
    - Pull-up bar
  participants: 1
  prep: 10s
  sections:
    - id: ssm
      title: Three rounds
      format: forTime
      transitionAfter: manualReady
      body:
        id: ssm-rounds
        type: repeat
        count: 3
        body:
          id: ssm-round
          type: sequence
          children:
            - id: ssm-ski
              type: task
              assignments:
                A:
                  name: SkiErg
                  distance:
                    value: 250
                    unit: m
            - id: ssm-double-unders
              type: task
              assignments:
                A:
                  name: Double-unders
                  reps: 50
            - id: ssm-muscle-ups
              type: task
              assignments:
                A:
                  name: Bar muscle-ups
                  reps: 5
