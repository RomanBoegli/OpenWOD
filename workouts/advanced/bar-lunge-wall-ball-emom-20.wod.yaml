format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: bar-lunge-wall-ball-emom-20
  revision: 1
  title: Bar, lunge & wall ball EMOM 20
  description: "Five movements, four rounds: thirty seconds of toes-to-bar, sixteen metres of single-dumbbell overhead lunges, thirty seconds of chest-to-bar pull-ups, twenty-four wall balls to the standard 10 ft (9 ft) target, then a minute of easy skiing or biking. The recovery minute is part of the plan; use it."
  attribution:
    author: Coach programming, shared in a members chat
    notes: Curated from a CrossFit class program; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Pull-up bar
    - Dumbbells
    - Medicine ball
    - Wall
    - SkiErg
  participants: 1
  prep: 10s
  sections:
    - id: blwb
      title: EMOM 20
      format: emom
      transitionAfter: manualReady
      interval: 1m
      intervals: 20
      body:
        id: blwb-stations
        type: sequence
        children:
          - id: blwb-t2b
            type: task
            assignments:
              A:
                notes: 30 s of work
                name: Toes-to-bar
                time: 30s
          - id: blwb-lunges
            type: task
            assignments:
              A:
                notes: One dumbbell, 2 × 8 m; switch arms halfway
                name: Dumbbell overhead walking lunges
                shortName: DB overhead lunges
                distance:
                  value: 16
                  unit: m
                load:
                  light:
                    value: 15
                    women: 10
                    unit: kg
                  medium:
                    value: 22.5
                    women: 15
                    unit: kg
                  heavy:
                    value: 30
                    women: 20
                    unit: kg
          - id: blwb-c2b
            type: task
            assignments:
              A:
                notes: 30 s of work
                name: Chest-to-bar pull-ups
                shortName: C2B pull-ups
                time: 30s
          - id: blwb-wall-balls
            type: task
            assignments:
              A:
                notes: 10 ft (9 ft) target
                name: Wall balls
                reps: 24
                load:
                  light:
                    value: 4
                    women: 3
                    unit: kg
                  medium:
                    value: 6
                    women: 4
                    unit: kg
                  heavy:
                    value: 9
                    women: 6
                    unit: kg
          - id: blwb-recovery
            type: task
            assignments:
              A:
                notes: Easy SkiErg or bike
                name: Active recovery
