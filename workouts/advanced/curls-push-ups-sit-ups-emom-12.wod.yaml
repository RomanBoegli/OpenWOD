format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: curls-push-ups-sit-ups-emom-12
  revision: 1
  title: Summer-body EMOM 12
  description: "Three movements, four rounds: biceps curls, push-ups and sit-ups, each on its own minute. The program calls it an EMOM 20, but three movements times four rounds is twelve minutes, so the clock runs twelve. Reps drop 14-12-10-8 across the rounds while the curl weight goes up."
  attribution:
    author: Coach programming, shared in a members chat
    notes: Curated from a CrossFit class program; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Dumbbells
  participants: 1
  prep: 10s
  sections:
    - id: summer
      title: EMOM 12
      format: emom
      transitionAfter: manualReady
      interval: 1m
      intervals: 12
      body:
        id: summer-stations
        type: sequence
        children:
          - id: summer-curls
            type: task
            assignments:
              A:
                notes: "Per dumbbell, a starting weight: 14-12-10-8 across the rounds, add weight each round"
                name: Biceps curls
                reps: 8
                load:
                  light:
                    value: 7.5
                    women: 5
                    unit: kg
                  medium:
                    value: 10
                    women: 7.5
                    unit: kg
                  heavy:
                    value: 15
                    women: 10
                    unit: kg
          - id: summer-push-ups
            type: task
            assignments:
              A:
                notes: 14-12-10-8 across the rounds; plate on the back if easy
                name: Push-ups
                reps: 8
          - id: summer-sit-ups
            type: task
            assignments:
              A:
                notes: A steady set; V-ups if you want more
                name: Sit-ups
