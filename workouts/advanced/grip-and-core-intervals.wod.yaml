format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: grip-and-core-intervals
  revision: 1
  title: Grip & Core Intervals
  description: Ten intervals of 45 seconds on and 20 seconds off, alternating a plate pinch hold with a kettlebell suitcase carry. Hold the plates or hang from the bar for the whole interval; on the carry, stand tall and switch hands halfway.
  attribution:
    author: Coach programming
    notes: Curated from a CrossFit class program shared in a members chat; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Weight plate
    - Kettlebell
  participants: 1
  prep: 10s
  sections:
    - id: grip
      title: Grip & Core
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: grip-rounds
        type: repeat
        count: 5
        betweenIterationsRest: 20s
        body:
          id: grip-pair
          type: sequence
          betweenChildrenRest: 20s
          children:
            - id: grip-pinch
              type: timed
              duration: 45s
              assignments:
                A:
                  notes: Per hand, smooth side out; or a dead hang from the bar
                  name: Plate Pinch Hold
                  load:
                    light:
                      value: 5
                      women: 2.5
                      unit: kg
                    medium:
                      value: 10
                      women: 5
                      unit: kg
                    heavy:
                      value: 15
                      women: 10
                      unit: kg
            - id: grip-carry
              type: timed
              duration: 45s
              assignments:
                A:
                  notes: One bell; switch hands halfway
                  name: Kettlebell Suitcase Carry
                  shortName: Suitcase Carry
                  load:
                    light:
                      value: 16
                      women: 12
                      unit: kg
                    medium:
                      value: 24
                      women: 16
                      unit: kg
                    heavy:
                      value: 32
                      women: 24
                      unit: kg
