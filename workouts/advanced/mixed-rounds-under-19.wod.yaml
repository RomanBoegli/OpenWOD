format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: mixed-rounds-under-19
  revision: 1
  title: Mixed Rounds Under 19
  description: "Four rounds for time under a nineteen-minute cap: squats, lunges, sit-ups, a short row, hand-release push-ups and ring rows, with thirty seconds of timed rest after each round. Nothing here is heavy, so the aim is to keep moving at one steady pace."
  attribution:
    author: Coach programming
    notes: Curated from a CrossFit class program shared in a members chat; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Weight plate
    - AbMat
    - Rowing machine
    - Rings
  participants: 1
  prep: 10s
  sections:
    - id: mixed-rounds
      title: Four Rounds
      format: forTime
      transitionAfter: manualReady
      cap: 19m
      body:
        id: mixed-rounds-repeat
        type: repeat
        count: 4
        betweenIterationsRest: 30s
        body:
          id: mixed-rounds-round
          type: sequence
          children:
            - id: mixed-rounds-squats
              type: task
              assignments:
                A:
                  name: Air Squats to a Plate
                  shortName: Squats to Plate
                  reps: 21
            - id: mixed-rounds-lunges
              type: task
              assignments:
                A:
                  name: Lunges
                  reps: 21
            - id: mixed-rounds-sit-ups
              type: task
              assignments:
                A:
                  name: AbMat Sit-Ups
                  reps: 15
            - id: mixed-rounds-row
              type: task
              assignments:
                A:
                  name: Row
                  calories: 15
            - id: mixed-rounds-push-ups
              type: task
              assignments:
                A:
                  name: Hand-Release Push-Ups
                  shortName: HR Push-Ups
                  reps: 9
            - id: mixed-rounds-ring-rows
              type: task
              assignments:
                A:
                  notes: Or barbell rows in the rack
                  name: Ring Rows
                  reps: 9
