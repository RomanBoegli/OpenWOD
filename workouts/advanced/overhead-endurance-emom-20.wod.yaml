format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: overhead-endurance-emom-20
  revision: 1
  title: Overhead endurance EMOM 20
  description: "Four movements, five rounds: thirty seconds of strict handstand push-ups, ten dumbbell overhead walking lunge steps, thirty seconds of kipping handstand push-ups, twenty wall balls to the standard 10 ft (9 ft) target. Pick a handstand push-up variation you can keep moving for the full thirty seconds."
  attribution:
    author: Coach programming
    notes: Curated from a CrossFit class program shared in a members chat; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Wall
    - Dumbbells
    - Medicine ball
  participants: 1
  prep: 10s
  sections:
    - id: overhead
      title: EMOM 20
      format: emom
      transitionAfter: manualReady
      interval: 1m
      intervals: 20
      body:
        id: overhead-stations
        type: sequence
        children:
          - id: overhead-strict-hspu
            type: task
            assignments:
              A:
                notes: 30 s of work; pike push-ups to scale
                name: Strict handstand push-ups
                shortName: Strict HSPU
                time: 30s
          - id: overhead-lunges
            type: task
            assignments:
              A:
                notes: Per dumbbell, two dumbbells overhead; 45 s cap
                name: Dumbbell overhead walking lunges
                shortName: DB overhead lunges
                reps: 10
                load:
                  light:
                    value: 7.5
                    women: 5
                    unit: kg
                  medium:
                    value: 10
                    women: 7.5
                    unit: kg
                  heavy:
                    value: 15
                    women: 10
                    unit: kg
          - id: overhead-kipping-hspu
            type: task
            assignments:
              A:
                notes: 30 s of work
                name: Kipping handstand push-ups
                shortName: Kipping HSPU
                time: 30s
          - id: overhead-wall-balls
            type: task
            assignments:
              A:
                notes: 10 ft (9 ft) target; 45 s cap
                name: Wall balls
                reps: 20
                load:
                  light:
                    value: 4
                    women: 3
                    unit: kg
                  medium:
                    value: 6
                    women: 4
                    unit: kg
                  heavy:
                    value: 9
                    women: 6
                    unit: kg
