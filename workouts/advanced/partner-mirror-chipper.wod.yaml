format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: partner-mirror-chipper
  revision: 1
  title: Partner Mirror Chipper
  description: "A chipper for two that climbs down and back up: row, wall balls, slam balls, handstand push-ups, burpees over the rower, then the same steps in reverse. One athlete works at a time; split every step however you like and tap Done when a step is finished."
  attribution:
    author: Coach programming
    notes: Curated from a CrossFit class program shared in a members chat; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Rowing machine
    - Medicine ball
    - Slam ball
    - Wall
  participants: 2
  prep: 10s
  sections:
    - id: mirror
      title: Chipper
      format: forTime
      transitionAfter: manualReady
      body:
        id: mirror-steps
        type: sequence
        children:
          - id: mirror-row-1
            type: task
            completion: team
            assignments:
              A:
                notes: Split as you like
                name: Row
                calories: 50
              B:
                notes: Split as you like
                name: Row
                calories: 50
          - id: mirror-wall-balls-1
            type: task
            completion: team
            assignments:
              A:
                notes: 10 ft (9 ft) target
                name: Wall Balls
                reps: 40
                load:
                  light:
                    value: 6
                    women: 4
                    unit: kg
                  medium:
                    value: 9
                    women: 6
                    unit: kg
                  heavy:
                    value: 12
                    women: 9
                    unit: kg
              B:
                notes: 10 ft (9 ft) target
                name: Wall Balls
                reps: 40
                load:
                  light:
                    value: 6
                    women: 4
                    unit: kg
                  medium:
                    value: 9
