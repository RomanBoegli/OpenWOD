                    unit: kg
                  heavy:
                    value: 12
                    women: 9
                    unit: kg
          - id: mirror-slam-balls-1
            type: task
            completion: team
            assignments:
              A:
                name: Slam Ball Ground-to-Overhead
                shortName: Slam Ball G2OH
                reps: 30
                load:
                  light:
                    value: 12
                    women: 10
                    unit: kg
                  medium:
                    value: 20
                    women: 15
                    unit: kg
                  heavy:
                    value: 30
                    women: 20
                    unit: kg
              B:
                name: Slam Ball Ground-to-Overhead
