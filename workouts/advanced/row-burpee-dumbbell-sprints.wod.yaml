format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: row-burpee-dumbbell-sprints
  revision: 1
  title: You go, I go sprints 12
  description: "Twelve sprint rounds, six each: fifteen calories on the rower, eight burpee box jump overs and six single-dumbbell clean and jerks, then tap Switch while your partner goes. You get about ninety seconds of rest every turn, so the dumbbell should be heavy and the row should hurt."
  attribution:
    author: Coach programming
    notes: Curated from a CrossFit class program shared in a members chat; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Rowing machine
    - Plyo box
    - Dumbbells
  participants: 2
  prep: 10s
  sections:
    - id: sprints-12
      title: Sprints
      format: youGoIGo
      transitionAfter: manualReady
      rounds: 6
      body:
        id: sprints-12-turn
        type: sequence
        children:
          - id: sprints-12-row
            type: task
            assignments:
              A:
                notes: 12 cal if scaling
                name: Row
                calories: 15
              B:
                notes: 12 cal if scaling
                name: Row
                calories: 15
          - id: sprints-12-burpees
            type: task
            assignments:
              A:
                notes: "Twist: box jump over, then burpee box jump over, one side; 24 in (20 in) box"
                name: Burpee box jump overs
                shortName: Burpee box overs
                reps: 8
              B:
                notes: "Twist: box jump over, then burpee box jump over, one side; 24 in (20 in) box"
                name: Burpee box jump overs
                shortName: Burpee box overs
                reps: 8
          - id: sprints-12-clean-jerks
            type: task
            assignments:
              A:
                notes: "Heavy: it should be challenging"
                name: Single-dumbbell clean and jerks
                shortName: DB clean & jerks
                reps: 6
                load:
                  light:
                    value: 15
                    women: 10
                    unit: kg
                  medium:
                    value: 25
                    women: 17.5
                    unit: kg
                  heavy:
                    value: 35
                    women: 22.5
                    unit: kg
              B:
                notes: "Heavy: it should be challenging"
                name: Single-dumbbell clean and jerks
                shortName: DB clean & jerks
                reps: 6
                load:
                  light:
                    value: 15
                    women: 10
                    unit: kg
                  medium:
                    value: 25
                    women: 17.5
                    unit: kg
                  heavy:
                    value: 35
                    women: 22.5
                    unit: kg
