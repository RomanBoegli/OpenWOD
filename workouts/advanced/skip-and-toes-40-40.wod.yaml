format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: skip-and-toes-40-40
  revision: 1
  title: Skip & toes 40/40
  description: Eight intervals of forty seconds on and forty off, alternating double-unders with toes-to-bar that end in a twenty-second core hold. Relaxed kip, tight midline, quality over quantity.
  attribution:
    author: Coach programming
    notes: Curated from a CrossFit class program shared in a members chat; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Jump rope
    - Pull-up bar
  participants: 1
  prep: 10s
  sections:
    - id: skip-toes
      title: Gymnastics & core
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: skip-toes-rounds
        type: repeat
        count: 4
        betweenIterationsRest: 40s
        body:
          id: skip-toes-pair
          type: sequence
          betweenChildrenRest: 40s
          children:
            - id: skip-toes-double-unders
              type: timed
              duration: 40s
              assignments:
                A:
                  notes: Done early? Hold a hollow position
                  name: Double-unders
                  reps: 40
            - id: skip-toes-t2b
              type: timed
              duration: 40s
              assignments:
                A:
                  notes: Then a 20 s hollow hold
                  name: Toes-to-bar
                  shortName: T2B + hollow hold
