format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: synchro-snatch-chipper
  revision: 1
  title: Synchro Snatch Chipper
  description: Ten to fifty and back down for a pair. The lunges, box jump overs and sit-ups are synchronised, so both of you tap Done; the squat snatches and dumbbell thrusters are shared, so split them and tap Done once. Keep the snatch bar at a weight you can cycle in singles without misses.
  attribution:
    author: Coach programming
    notes: Curated from a CrossFit class program shared in a members chat; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Dumbbells
    - Barbell
    - Plyo box
    - AbMat
  participants: 2
  prep: 10s
  sections:
    - id: synchro
      title: Chipper
      format: forTime
      transitionAfter: manualReady
      body:
        id: synchro-steps
        type: sequence
        children:
          - id: synchro-lunges-1
            type: task
            completion: both
            assignments:
              A:
                notes: Synchro, one dumbbell each
                name: Dumbbell Overhead Lunges
                shortName: DB Overhead Lunges
                reps: 10
                load:
                  light:
                    value: 10
                    women: 7.5
                    unit: kg
                  medium:
                    value: 15
                    women: 10
                    unit: kg
                  heavy:
                    value: 22.5
                    women: 15
                    unit: kg
              B:
                notes: Synchro, one dumbbell each
                name: Dumbbell Overhead Lunges
                shortName: DB Overhead Lunges
                reps: 10
                load:
                  light:
                    value: 10
                    women: 7.5
                    unit: kg
                  medium:
                    value: 15
                    women: 10
                    unit: kg
                  heavy:
                    value: 22.5
                    women: 15
                    unit: kg
          - id: synchro-snatches-1
            type: task
            completion: team
            assignments:
              A:
                notes: Split as you like
                name: Squat Snatches
                reps: 20
                load:
                  light:
                    value: 30
                    women: 20
                    unit: kg
                  medium:
                    value: 42
                    women: 30
