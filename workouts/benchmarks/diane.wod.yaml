format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: diane
  revision: 1
  title: Diane
  description: Deadlifts and handstand push-ups, 21-15-9. The deadlift is heavy enough to demand a solid back, and the handstand push-ups will slow down quickly, so break both early. Scale the bar to about sixty percent of your max and use a box or pike push-ups for the handstands; the twelve-minute cap is a training suggestion, not part of the benchmark.
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/benchmark/diane
    notes: Follows the published benchmark. Heavy is the published Rx for men with the women’s Rx in brackets; medium and light are common scalings, rounded to plate and kettlebell sizes.
  equipment:
    - Barbell
    - Wall
  participants: 1
  prep: 10s
  sections:
    - id: diane-for-time
      title: 21-15-9
      format: forTime
      transitionAfter: manualReady
      cap: 12m
      body:
        id: diane-ladder
        type: sequence
        children:
          - id: diane-deadlifts-21
            type: task
            assignments:
              A:
                name: Deadlifts
                reps: 21
                load:
                  light:
                    value: 45
                    women: 32
                    unit: kg
                  medium:
                    value: 70
                    women: 50
                    unit: kg
                  heavy:
                    value: 102
                    women: 70
                    unit: kg
          - id: diane-hspu-21
            type: task
            assignments:
              A:
                name: Handstand Push-Ups
                shortName: HSPU
                reps: 21
          - id: diane-deadlifts-15
            type: task
            assignments:
