format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: elizabeth
  revision: 1
  title: Elizabeth
  description: Cleans and ring dips, 21-15-9. Squat cleans are the standard and they cook the legs, so settle into a cycle you can keep rather than chasing early speed; the dips fade fast once the triceps tire. Scale the bar or use power cleans, and swap ring dips for bar dips or push-ups; the fifteen-minute cap is a training suggestion, not part of the benchmark.
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/benchmark/elizabeth
    notes: Follows the published benchmark. Heavy is the published Rx for men with the women’s Rx in brackets; medium and light are common scalings, rounded to plate and kettlebell sizes.
  equipment:
    - Barbell
    - Rings
  participants: 1
  prep: 10s
  sections:
    - id: elizabeth-for-time
      title: 21-15-9
      format: forTime
      transitionAfter: manualReady
      cap: 15m
      body:
        id: elizabeth-ladder
        type: sequence
        children:
