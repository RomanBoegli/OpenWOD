format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: fight-gone-bad
  revision: 1
  title: Fight Gone Bad
  description: "Three five-minute rounds that mimic a fight: five movements, one minute each, the clock never stops, one minute to breathe between rounds. Wall balls go to a 10 ft target (9 ft for women) with a 20 lb (14 lb) ball, the sumo deadlift high pulls and push presses use 75 lb (55 lb), the box is 20 in for everyone and the row counts calories. Count every rep and every calorie."
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/workout/2013/09/22
    notes: Follows the published benchmark structure. Loads shown are the published Rx; scale freely.
  equipment:
    - Medicine ball
    - Wall
    - Barbell
    - Plyo box
    - Rowing machine
  participants: 1
  prep: 10s
  sections:
    - id: fgb
      title: Fight Gone Bad
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: fgb-rounds
        type: repeat
        count: 3
        betweenIterationsRest: 1m
        body:
          id: fgb-stations
          type: sequence
          children:
            - id: fgb-wall-ball
              type: timed
              duration: 1m
              assignments:
                A:
                  notes: 10 ft (9 ft) target
                  name: Wall balls
                  shortName: Wall balls
                  load:
                    light:
                      value: 4
                      women: 3
                      unit: kg
                    medium:
                      value: 6
                      women: 4
                      unit: kg
                    heavy:
                      value: 9
                      women: 6
                      unit: kg
            - id: fgb-sdhp
              type: timed
              duration: 1m
              assignments:
                A:
                  name: Sumo deadlift high pulls
                  shortName: SDHP
                  spokenName: sumo deadlift high pulls
                  load:
                    light:
                      value: 15
                      women: 12
                      unit: kg
                    medium:
                      value: 25
                      women: 19
                      unit: kg
                    heavy:
                      value: 34
                      women: 25
                      unit: kg
            - id: fgb-box-jump
              type: timed
              duration: 1m
              assignments:
                A:
                  notes: 20 in box (step-ups to scale)
                  name: Box jumps
            - id: fgb-push-press
              type: timed
              duration: 1m
              assignments:
                A:
                  name: Push presses
                  load:
                    light:
                      value: 15
                      women: 12
                      unit: kg
                    medium:
                      value: 25
                      women: 19
                      unit: kg
                    heavy:
                      value: 34
                      women: 25
                      unit: kg
            - id: fgb-row
              type: timed
              duration: 1m
              assignments:
                A:
                  notes: Score calories
                  name: Row
