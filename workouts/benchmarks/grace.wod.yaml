format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: grace
  revision: 1
  title: Grace
  description: Thirty clean and jerks as fast as you can. Quick singles with a tight turnaround usually beat sets that fall apart; keep the technique sharp as the bar gets heavy. Scale the load so every rep is a sound lift; the eight-minute cap is a training suggestion, not part of the benchmark.
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/benchmark/grace
    notes: Follows the published benchmark. Heavy is the published Rx for men with the women’s Rx in brackets; medium and light are common scalings, rounded to plate and kettlebell sizes.
  equipment:
    - Barbell
  participants: 1
  prep: 10s
  sections:
    - id: grace-for-time
      title: 30 Clean and Jerks
      format: forTime
      transitionAfter: manualReady
      cap: 8m
      body:
        id: grace-clean-and-jerks
        type: task
        assignments:
          A:
            notes: Ground to overhead, any style
            name: Clean and Jerks
            reps: 30
            load:
              light:
                value: 30
                women: 20
                unit: kg
              medium:
                value: 43
                women: 30
                unit: kg
              heavy:
                value: 61
                women: 43
                unit: kg
