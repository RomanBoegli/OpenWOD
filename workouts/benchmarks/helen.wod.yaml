format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: helen
  revision: 1
  title: Helen
  description: Three rounds of a 400 metre run, twenty-one kettlebell swings and twelve pull-ups. Run at a pace that lets you pick up the bell straight away and swing unbroken; the pull-ups are where most people lose time. Scale the bell and use a band or jumping pull-ups if needed; the fifteen-minute cap is a training suggestion, not part of the benchmark.
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/benchmark/helen
    notes: Follows the published benchmark. Heavy is the published Rx for men with the women’s Rx in brackets; medium and light are common scalings, rounded to plate and kettlebell sizes.
  equipment:
    - Running route
    - Kettlebell
    - Pull-up bar
  participants: 1
  prep: 10s
  sections:
    - id: helen-for-time
      title: Three rounds
      format: forTime
      transitionAfter: manualReady
      cap: 15m
      body:
        id: helen-rounds
        type: repeat
        count: 3
        body:
          id: helen-rounds-round
          type: sequence
          children:
            - id: helen-run
              type: task
              assignments:
                A:
                  name: Run
                  distance:
                    value: 400
                    unit: m
            - id: helen-swings
              type: task
              assignments:
                A:
                  name: Kettlebell Swings
                  reps: 21
                  load:
                    light:
                      value: 12
                      women: 8
                      unit: kg
                    medium:
                      value: 16
                      women: 12
                      unit: kg
                    heavy:
                      value: 24
                      women: 16
                      unit: kg
            - id: helen-pull-ups
              type: task
              assignments:
                A:
                  name: Pull-Ups
                  reps: 12
