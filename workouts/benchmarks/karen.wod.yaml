format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: karen
  revision: 1
  title: Karen
  description: One hundred and fifty wall-ball shots, nothing else. Break them into sets you can repeat from the first rep, because the last fifty decide the time. Scale the ball or the target height before you scale the count; the ten-minute cap is a training suggestion, not part of the benchmark.
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/benchmark/karen
    notes: Follows the published benchmark. Heavy is the published Rx for men with the women’s Rx in brackets; medium and light are common scalings, rounded to plate and kettlebell sizes.
  equipment:
    - Medicine ball
    - Wall
  participants: 1
  prep: 10s
  sections:
    - id: karen-for-time
      title: 150 wall balls
      format: forTime
      transitionAfter: manualReady
      cap: 10m
      body:
        id: karen-wall-balls
        type: task
        assignments:
          A:
            notes: 10 ft target (9 ft for women)
            name: Wall-Ball Shots
            reps: 150
            load:
              light:
                value: 4
                women: 3
                unit: kg
              medium:
                value: 6
                women: 4
                unit: kg
              heavy:
                value: 9
                women: 6
                unit: kg
