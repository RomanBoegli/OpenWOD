format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: nancy
  revision: 1
  title: Nancy
  description: Five rounds of a 400 metre run and fifteen overhead squats. The squats are light, so the test is holding a stable overhead position while breathing hard; keep the runs honest but controlled. Scale to a bar you can hold overhead for fifteen unbroken reps; the twenty-minute cap is a training suggestion, not part of the benchmark.
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/benchmark/nancy
    notes: Follows the published benchmark. Heavy is the published Rx for men with the women’s Rx in brackets; medium and light are common scalings, rounded to plate and kettlebell sizes.
  equipment:
    - Running route
    - Barbell
  participants: 1
  prep: 10s
  sections:
    - id: nancy-for-time
      title: Five rounds
      format: forTime
      transitionAfter: manualReady
      cap: 20m
      body:
        id: nancy-rounds
        type: repeat
        count: 5
        body:
          id: nancy-rounds-round
          type: sequence
          children:
            - id: nancy-run
              type: task
              assignments:
                A:
                  name: Run
                  distance:
                    value: 400
                    unit: m
            - id: nancy-ohs
              type: task
              assignments:
                A:
                  name: Overhead squats
                  reps: 15
                  load:
                    light:
                      value: 20
                      women: 15
                      unit: kg
                    medium:
                      value: 30
                      women: 20
                      unit: kg
                    heavy:
                      value: 43
                      women: 29
                      unit: kg
