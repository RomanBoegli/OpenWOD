format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: tommy-v
  revision: 1
  title: Tommy V
  description: Thrusters 21-15-9 paired with rope climbs 12-9-6 on a fifteen-foot rope. The climbs are the long part; use your legs, descend under control and treat each one as its own rep rather than racing. Scale the thruster load and swap climbs for rope pulls from the floor or a fixed count of pull-ups; the twenty-five-minute cap is a training suggestion, not part of the benchmark.
  attribution:
    author: CrossFit
    sourceUrl: https://www.crossfit.com/benchmark/tommy-v
    notes: Follows the published benchmark. Heavy is the published Rx for men with the women’s Rx in brackets; medium and light are common scalings, rounded to plate and kettlebell sizes.
  equipment:
    - Barbell
    - Climbing rope
  participants: 1
  prep: 10s
  sections:
    - id: tommy-v-for-time
      title: Thrusters and rope climbs
      format: forTime
      transitionAfter: manualReady
      cap: 25m
      body:
        id: tommy-v-ladder
        type: sequence
        children:
