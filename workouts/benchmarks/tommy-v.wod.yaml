                    value: 22.5
                    women: 15
                    unit: kg
                  medium:
                    value: 35
                    women: 22.5
                    unit: kg
                  heavy:
                    value: 52
                    women: 34
                    unit: kg
          - id: tommy-v-rope-climbs-12
            type: task
            assignments:
