format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: pause-front-squat-6x3
  revision: 1
  title: Pause front squat 6 × 3
  description: Six sets of three front squats with a one- to two-second pause in the bottom, starting around sixty-five percent and building only while the position stays strong. Heavy but clean. Tap Done after each set; ninety seconds of rest are timed, and the program allows up to two minutes.
  attribution:
    author: Coach programming, shared in a members chat
    notes: Curated from a CrossFit class program; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Barbell
    - Squat rack
  participants: 1
  prep: 10s
  sections:
    - id: pause-fs
      title: Pause front squat
      format: strength
      transitionAfter: manualReady
      body:
        id: pause-fs-sets
        type: repeat
        count: 6
        betweenIterationsRest: 1m30s
        body:
          id: pause-fs-set
          type: task
          assignments:
            A:
              notes: 1–2 s pause in the bottom; build only if position holds
              name: Pause front squat
              reps: 3
              load:
                light:
                  value: 60
                  unit: percent
                medium:
                  value: 65
                  unit: percent
                heavy:
                  value: 70
                  unit: percent
