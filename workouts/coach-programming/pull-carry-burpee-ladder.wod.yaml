format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: pull-carry-burpee-ladder
  revision: 1
  title: Pull, carry, burpee ladder
  description: "An ascending ladder: one pull-up, one lane of farmers carry and one burpee over the dumbbells, then two of each, then three, and so on for fifteen minutes. The program allows twelve to fifteen minutes; the cap here is fifteen. Score the completed rounds."
  attribution:
    author: Coach programming, shared in a members chat
    notes: Curated from a CrossFit class program; loads are training suggestions with light/medium/heavy levels added by OpenWOD.
  equipment:
    - Pull-up bar
    - Dumbbells
  participants: 1
  prep: 10s
  sections:
    - id: ladder
      title: AMRAP 15
      format: amrap
      transitionAfter: manualReady
      cap: 15m
      counter: rounds
      body:
        id: ladder-round
        type: sequence
        children:
          - id: ladder-pull-ups
            type: task
            assignments:
              A:
                notes: "Round 1: 1 rep, round 2: 2 reps, and so on"
                name: Pull-ups
          - id: ladder-carry
            type: task
            assignments:
              A:
                notes: Per hand; lane lengths climb with the round; no grips
                name: Dumbbell farmers carry
                shortName: Farmers carry
                load:
                  light:
                    value: 12
                    women: 7.5
                    unit: kg
                  medium:
                    value: 17.5
                    women: 12.5
                    unit: kg
                  heavy:
                    value: 22.5
                    women: 15
                    unit: kg
          - id: ladder-burpees
            type: task
            assignments:
              A:
                notes: Reps climb with the round
                name: Burpees over dumbbells
                shortName: Burpees over DB
