format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: dumbbell-full-body-35
  revision: 1
  title: Dumbbell Full Body Crunch
  description: "Thirty-five minutes with dumbbells: a timed warm-up, then legs, back and chest, shoulders and arms, and core, two rounds each within a 7-minute cap. One pair of dumbbells for the squats, hinges, lunges, rows, floor press and pullovers and a lighter pair for the shoulders, arms and core. Pick heavy dumbbells and keep every rep clean."
  attribution:
    author: OpenWOD
  equipment:
    - Dumbbells
    - Exercise mat
  participants: 1
  prep: 10s
  sections:
    - id: warm-up
      title: Warm-Up
      format: timedCircuit
      transitionAfter: automatic
      body:
        id: warm-up-body
        type: sequence
        children:
          - id: warm-up-sequence
            type: sequence
            children:
              - id: warm-up-jacks
                type: timed
                duration: 45s
                assignments:
                  A:
                    name: Jumping Jacks
              - id: warm-up-arm-circles
                type: timed
                duration: 30s
                assignments:
                  A:
                    name: Arm Circles
              - id: warm-up-inchworms
                type: timed
                duration: 45s
                assignments:
                  A:
                    name: Inchworms
              - id: warm-up-squats
                type: timed
                duration: 45s
                assignments:
                  A:
                    name: Air Squats
              - id: warm-up-good-mornings
                type: timed
                duration: 45s
                assignments:
                  A:
                    name: Bodyweight Good Mornings
              - id: warm-up-shoulder-taps
                type: timed
                duration: 1m
                assignments:
                  A:
                    name: Plank Shoulder Taps
          - id: warm-up-rest
            type: rest
            duration: 1m
            kind: blockRest
    - id: legs
      title: Legs & Glutes
      format: forTime
      transitionAfter: manualReady
      cap: 7m
      body:
        id: legs-rounds
        type: repeat
        count: 2
        betweenIterationsRest: 20s
        body:
          id: legs-round
          type: sequence
          betweenChildrenRest: 10s
          children:
            - id: legs-goblet-squats
              type: task
              assignments:
                A:
                  notes: single (one dumbbell held with both hands)
                  name: Dumbbell Goblet Squats
                  reps: 12
                  load:
                    light:
                      value: 8
                      women: 6
                      unit: kg
                    medium:
                      value: 12
                      women: 10
                      unit: kg
                    heavy:
                      value: 20
                      women: 15
                      unit: kg
            - id: legs-romanian-deadlifts
              type: task
              assignments:
                A:
                  notes: double (one dumbbell per hand)
                  name: Dumbbell Romanian Deadlifts
                  reps: 12
                  load:
                    light:
                      value: 7.5
                      women: 5
                      unit: kg
                    medium:
                      value: 10
                      women: 7.5
                      unit: kg
                    heavy:
                      value: 15
                      women: 10
                      unit: kg
            - id: legs-front-rack-lunges
              type: task
              assignments:
                A:
                  notes: double (one dumbbell per hand)
                  name: Dumbbell Front Rack Lunges
                  reps: 12
                  load:
                    light:
                      value: 7.5
                      women: 5
                      unit: kg
                    medium:
                      value: 10
                      women: 7.5
                      unit: kg
                    heavy:
                      value: 15
                      women: 10
                      unit: kg
    - id: back-chest
      title: Back & Chest
      format: forTime
      transitionAfter: manualReady
      cap: 7m
      body:
        id: back-chest-rounds
        type: repeat
        count: 2
        betweenIterationsRest: 20s
        body:
          id: back-chest-round
          type: sequence
          betweenChildrenRest: 10s
          children:
            - id: back-chest-rows
              type: task
              assignments:
                A:
                  notes: single (change halfway)
                  name: Bent-Over Dumbbell Rows
                  reps: 24
                  load:
                    light:
                      value: 7.5
                      women: 5
                      unit: kg
                    medium:
                      value: 10
                      women: 7.5
                      unit: kg
                    heavy:
                      value: 15
                      women: 10
                      unit: kg
            - id: back-chest-floor-press
              type: task
              assignments:
                A:
                  notes: double (one dumbbell per hand)
                  name: Floor Press
                  reps: 24
                  load:
                    light:
                      value: 7.5
                      women: 5
                      unit: kg
                    medium:
                      value: 10
                      women: 7.5
                      unit: kg
                    heavy:
                      value: 15
                      women: 10
                      unit: kg
            - id: back-chest-pullovers
              type: task
              assignments:
                A:
                  notes: single (one dumbbell held with both hands)
                  name: Dumbbell Pullovers
                  reps: 15
                  load:
                    light:
                      value: 7.5
                      women: 5
                      unit: kg
                    medium:
                      value: 10
                      women: 7.5
                      unit: kg
                    heavy:
                      value: 15
                      women: 10
                      unit: kg
    - id: shoulders-arms
      title: Shoulders & Arms
      format: forTime
      transitionAfter: manualReady
      cap: 7m
      body:
        id: shoulders-arms-rounds
        type: repeat
        count: 2
        betweenIterationsRest: 20s
        body:
          id: shoulders-arms-round
          type: sequence
          betweenChildrenRest: 10s
          children:
            - id: shoulders-arms-press
              type: task
              assignments:
                A:
                  notes: double (one dumbbell per hand, simultaneously)
                  name: Dumbbell Shoulder Press
                  reps: 15
                  load:
                    light:
                      value: 5
                      women: 2.5
                      unit: kg
                    medium:
                      value: 7.5
                      women: 5
                      unit: kg
                    heavy:
                      value: 10
                      women: 7.5
                      unit: kg
            - id: shoulders-arms-curls
              type: task
              assignments:
                A:
                  notes: double (one dumbbell per hand, simultaneously)
                  name: Biceps Curls
                  reps: 15
                  load:
                    light:
                      value: 5
                      women: 2.5
                      unit: kg
                    medium:
                      value: 7.5
                      women: 5
                      unit: kg
                    heavy:
                      value: 10
                      women: 7.5
                      unit: kg
            - id: shoulders-arms-triceps
              type: task
              assignments:
                A:
                  notes: single (one dumbbell held with both hands)
                  name: Overhead Triceps Extensions
                  reps: 15
                  load:
                    light:
                      value: 5
                      women: 2.5
                      unit: kg
                    medium:
                      value: 7.5
                      women: 5
                      unit: kg
                    heavy:
                      value: 10
                      women: 7.5
                      unit: kg
            - id: shoulders-arms-lateral-raises
              type: task
              assignments:
                A:
                  notes: double (one dumbbell per hand, simultaneously)
                  name: Lateral Raises
                  reps: 10
                  load:
                    light:
                      value: 5
                      women: 2.5
                      unit: kg
                    medium:
                      value: 7.5
                      women: 5
                      unit: kg
                    heavy:
                      value: 10
                      women: 7.5
                      unit: kg
    - id: core
      title: Abs & Core
      format: forTime
      transitionAfter: manualReady
      cap: 7m
      body:
        id: core-rounds
        type: repeat
        count: 2
        betweenIterationsRest: 10s
        body:
          id: core-round
          type: sequence
          betweenChildrenRest: 5s
          children:
            - id: core-russian-twists
              type: task
              assignments:
                A:
                  notes: single (one dumbbell held with both hands)
                  name: Russian Twists
                  reps: 20
                  load:
                    light:
                      value: 7.5
                      women: 5
                      unit: kg
                    medium:
                      value: 10
                      women: 7.5
                      unit: kg
                    heavy:
                      value: 15
                      women: 12
                      unit: kg
            - id: core-sit-ups
              type: task
              assignments:
                A:
                  notes: single (one dumbbell held with both hands)
                  name: Dumbbell Overhead Sit-Ups
                  reps: 15
                  load:
                    light:
                      value: 5
                      women: 2.5
                      unit: kg
                    medium:
                      value: 7.5
                      women: 5
                      unit: kg
                    heavy:
                      value: 10
                      women: 7.5
                      unit: kg
            - id: core-plank-rows
              type: task
              assignments:
                A:
                  notes: single (change halfway)
                  name: Plank Rows
                  reps: 20
                  load:
                    light:
                      value: 5
                      women: 2.5
                      unit: kg
                    medium:
                      value: 7.5
                      women: 5
                      unit: kg
                    heavy:
                      value: 10
                      women: 7.5
                      unit: kg
            - id: core-dead-bugs
              type: task
              assignments:
                A:
                  name: Dead Bugs
                  reps: 15
