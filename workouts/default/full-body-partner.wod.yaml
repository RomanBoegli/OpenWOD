                      name: Mountain Climbers
                    B:
                      notes: One dumbbell in both hands; switch sides halfway
                      name: Dumbbell Woodchoppers
                      load:
                        light:
                          value: 5
                          women: 2.5
                          unit: kg
                        medium:
                          value: 7.5
                          women: 5
                          unit: kg
                        heavy:
                          value: 10
                          women: 7.5
                          unit: kg
          - id: block-3-rest
            type: rest
            duration: 2m
            kind: blockRest
    - id: block-4
      title: HYROX finisher
      format: timedCircuit
