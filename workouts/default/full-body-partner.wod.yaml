format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: full-body-partner
  revision: 1
  title: Full Body Partner Workout
  description: "Bodyweight meets dumbbells. Every loaded movement in the B column uses dumbbells: one pair for the squats, hinges, cleans and carries and a lighter pair for the presses, curls, extensions and chops. A and B swap each round, then take two minutes to recover before the next block."
  attribution:
    author: OpenWOD
    notes: Encoded from docs/source/example-wod.md with its timing made explicit (section 6.5 of AGENT.md).
  equipment:
    - Dumbbells
    - Exercise mat
  participants: 2
  prep: 10s
  sections:
    - id: warm-up
      title: Warm-up
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: warm-up-sequence
        type: sequence
        children:
          - id: warm-up-1
            type: timed
            duration: 1m
            assignments:
              A:
                name: Jumping Jacks
              B:
                name: Jumping Jacks
          - id: warm-up-2
            type: timed
            duration: 1m
            assignments:
              A:
                name: Air Squats
              B:
                name: Air Squats
          - id: warm-up-3
            type: timed
            duration: 1m
            assignments:
              A:
                name: Arm Circles & Shoulder Mobility
              B:
                name: Arm Circles & Shoulder Mobility
          - id: warm-up-4
            type: timed
            duration: 1m
            assignments:
              A:
                name: Alternating Lunges
              B:
                name: Alternating Lunges
          - id: warm-up-5
            type: timed
            duration: 1m
            assignments:
              A:
                name: Inchworms
              B:
                name: Inchworms
    - id: block-1
      title: Legs & strength
      format: timedCircuit
      transitionAfter: automatic
      body:
        id: block-1-body
        type: sequence
        children:
          - id: block-1-rounds
            type: repeat
            count: 2
            assignmentPolicy: alternate
            betweenIterationsRest: 20s
            body:
              id: block-1-stations
              type: sequence
              betweenChildrenRest: 20s
              children:
                - id: block-1-slot-1
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Air Squats
                    B:
                      notes: Per dumbbell
                      name: Dumbbell Thrusters
                      load:
                        light:
                          value: 7.5
                          women: 5
                          unit: kg
                        medium:
                          value: 10
                          women: 7.5
                          unit: kg
                        heavy:
                          value: 15
                          women: 10
                          unit: kg
                - id: block-1-slot-2
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Jump Squats
                    B:
                      notes: One dumbbell held at the chest
                      name: Dumbbell Goblet Squats
                      load:
                        light:
                          value: 7.5
                          women: 5
                          unit: kg
                        medium:
                          value: 10
                          women: 7.5
                          unit: kg
                        heavy:
                          value: 15
                          women: 10
                          unit: kg
                - id: block-1-slot-3
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Mountain Climbers
                    B:
                      notes: With dumbbells, one per hand
                      name: Dumbbell Romanian Deadlifts
                      load:
                        light:
                          value: 7.5
                          women: 5
                          unit: kg
                        medium:
                          value: 10
                          women: 7.5
                          unit: kg
                        heavy:
                          value: 15
                          women: 10
                          unit: kg
                - id: block-1-slot-4
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Burpees
                    B:
                      name: Alternating Lunges
          - id: block-1-rest
            type: rest
            duration: 2m
            kind: blockRest
    - id: block-2
      title: Upper body & arms
      format: timedCircuit
      transitionAfter: automatic
      body:
        id: block-2-body
        type: sequence
        children:
          - id: block-2-rounds
            type: repeat
            count: 2
            assignmentPolicy: alternate
            betweenIterationsRest: 20s
            body:
              id: block-2-stations
              type: sequence
              betweenChildrenRest: 20s
              children:
                - id: block-2-slot-1
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Push-Ups
                    B:
                      notes: With dumbbells, one per hand
                      name: Dumbbell Rows
                      load:
                        light:
                          value: 7.5
                          women: 5
                          unit: kg
                        medium:
                          value: 10
                          women: 7.5
                          unit: kg
                        heavy:
                          value: 15
                          women: 10
                          unit: kg
                - id: block-2-slot-2
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Plank Shoulder Taps
                    B:
                      notes: With dumbbells, one per hand
                      name: Dumbbell Shoulder Press
                      load:
                        light:
                          value: 5
                          women: 2.5
                          unit: kg
                        medium:
                          value: 7.5
                          women: 5
                          unit: kg
                        heavy:
                          value: 10
                          women: 7.5
                          unit: kg
                - id: block-2-slot-3
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Triceps Dips
                    B:
                      notes: Per dumbbell
                      name: Biceps Curls
                      load:
