    - id: cool-down
      title: Cool-down
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: cool-down-sequence
        type: sequence
        children:
          - id: cool-down-1
            type: timed
            duration: 1m
            assignments:
              A:
                name: Quad Stretch
              B:
                name: Quad Stretch
          - id: cool-down-2
