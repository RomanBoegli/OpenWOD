                          value: 5
                          women: 2.5
                          unit: kg
                        medium:
                          value: 7.5
                          women: 5
                          unit: kg
                        heavy:
                          value: 10
                          women: 7.5
                          unit: kg
                - id: block-2-slot-4
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Burpees
                    B:
                      notes: Per dumbbell
                      name: Overhead Triceps Extensions
                      load:
                        light:
                          value: 5
                          women: 2.5
                          unit: kg
                        medium:
                          value: 7.5
                          women: 5
                          unit: kg
                        heavy:
                          value: 10
                          women: 7.5
                          unit: kg
          - id: block-2-rest
            type: rest
            duration: 2m
            kind: blockRest
    - id: block-3
      title: Abs & core
      format: timedCircuit
      transitionAfter: automatic
      body:
        id: block-3-body
        type: sequence
        children:
          - id: block-3-rounds
            type: repeat
            count: 2
            assignmentPolicy: alternate
            betweenIterationsRest: 20s
            body:
              id: block-3-stations
              type: sequence
              betweenChildrenRest: 20s
              children:
