format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: full-body-partner
  revision: 1
  title: Full body partner workout
  description: "Bodyweight meets dumbbells. Every loaded station in the B column uses dumbbells: one pair for the squats, hinges, cleans and carries and a lighter pair for the presses, curls, extensions and chops. Switch task columns each round, then take two minutes to recover before the next block."
  attribution:
    author: OpenWOD
    notes: Encoded from docs/source/example-wod.md with its timing made explicit (section 6.5 of AGENT.md).
  equipment:
    - Dumbbells
    - Exercise mat
  participants: 2
  prep: 10s
  sections:
    - id: warm-up
      title: Warm-up
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: warm-up-sequence
        type: sequence
        children:
          - id: warm-up-1
            type: timed
            duration: 1m
            assignments:
              A:
                name: Jumping jacks
              B:
                name: Jumping jacks
          - id: warm-up-2
            type: timed
            duration: 1m
            assignments:
              A:
                name: Air squats
              B:
                name: Air squats
          - id: warm-up-3
            type: timed
            duration: 1m
            assignments:
              A:
                name: Arm circles & shoulder mobility
              B:
                name: Arm circles & shoulder mobility
          - id: warm-up-4
            type: timed
            duration: 1m
            assignments:
              A:
                name: Alternating lunges
              B:
                name: Alternating lunges
          - id: warm-up-5
            type: timed
            duration: 1m
            assignments:
              A:
                name: Inchworms
              B:
                name: Inchworms
    - id: block-1
      title: Legs & strength
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: block-1-body
        type: sequence
        children:
          - id: block-1-rounds
            type: repeat
            count: 2
            assignmentPolicy: alternate
            betweenIterationsRest: 20s
            body:
              id: block-1-stations
              type: sequence
              betweenChildrenRest: 20s
              children:
                - id: block-1-slot-1
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Air squats
                    B:
                      notes: Per dumbbell
                      name: Dumbbell thrusters
                      load:
                        light:
                          value: 7.5
                          women: 5
                          unit: kg
                        medium:
                          value: 10
                          women: 7.5
                          unit: kg
                        heavy:
                          value: 15
                          women: 10
                          unit: kg
                - id: block-1-slot-2
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Jump squats
                    B:
                      notes: One dumbbell held at the chest
                      name: Dumbbell goblet squats
                      load:
                        light:
                          value: 7.5
                          women: 5
                          unit: kg
                        medium:
                          value: 10
                          women: 7.5
                          unit: kg
                        heavy:
                          value: 15
                          women: 10
                          unit: kg
                - id: block-1-slot-3
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Mountain climbers
                    B:
                      notes: With dumbbells, one per hand
                      name: Dumbbell Romanian deadlifts
                      load:
                        light:
                          value: 7.5
                          women: 5
                          unit: kg
                        medium:
                          value: 10
                          women: 7.5
                          unit: kg
                        heavy:
                          value: 15
                          women: 10
                          unit: kg
                - id: block-1-slot-4
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Burpees
                    B:
                      name: Alternating lunges
          - id: block-1-rest
            type: rest
            duration: 2m20s
            kind: blockRest
    - id: block-2
      title: Upper body & arms
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: block-2-body
        type: sequence
        children:
          - id: block-2-rounds
            type: repeat
            count: 2
            assignmentPolicy: alternate
            betweenIterationsRest: 20s
            body:
              id: block-2-stations
              type: sequence
              betweenChildrenRest: 20s
              children:
                - id: block-2-slot-1
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Push-ups
                    B:
                      notes: With dumbbells, one per hand
                      name: Dumbbell rows
                      load:
                        light:
                          value: 7.5
                          women: 5
                          unit: kg
                        medium:
                          value: 10
                          women: 7.5
                          unit: kg
                        heavy:
                          value: 15
                          women: 10
                          unit: kg
                - id: block-2-slot-2
                  type: timed
                  duration: 40s
                  assignments:
                    A:
                      name: Plank shoulder taps
                    B:
                      notes: With dumbbells, one per hand
                      name: Dumbbell shoulder press
                      load:
                        light:
