format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: you-go-i-go-sprints
  revision: 1
  title: You go, I go sprints
  description: "One athlete works while the other rests: ten calories on the rower and five burpees, then tap Switch. A turn plus a B turn makes one team round. Keep the turns short and the rests honest; twelve minutes total."
  attribution:
    author: OpenWOD
    notes: A you-go-I-go sprint format common in partner classes.
  equipment:
    - Rowing machine
  participants: 2
  prep: 10s
  sections:
    - id: sprints
      title: Sprints
      format: youGoIGo
      transitionAfter: manualReady
      cap: 12m
      body:
        id: sprints-turn
        type: sequence
        children:
          - id: sprints-row
            type: task
            assignments:
              A:
                name: Row
                calories: 10
              B:
                name: Row
                calories: 10
          - id: sprints-burpees
            type: task
            assignments:
              A:
                name: Burpees
                reps: 5
              B:
                name: Burpees
                reps: 5
