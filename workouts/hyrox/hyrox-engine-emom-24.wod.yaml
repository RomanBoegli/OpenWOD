format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: hyrox-engine-emom-24
  revision: 1
  title: HYROX engine EMOM 24
  description: "Every minute for 24 minutes: a hard minute of running, a minute on the next station, a minute of wall balls. Eight cycles cover all eight stations. Heavy is the open standard: sled push 152 kg (women 102 kg, incl. sled), sled pull 103 kg (78 kg), farmers carry 2 × 24 kg (2 × 16 kg), sandbag lunges 20 kg (10 kg), wall balls 6 kg (4 kg) to a 3 m (2.7 m) target. Keep moving for the full minute; the next one starts whether you are ready or not."
  attribution:
    author: OpenWOD
    sourceUrl: https://hyrox.com/the-fitness-race/
    notes: "A training variation of the published HYROX race structure (8 runs, 8 stations); the format is not an official prescription. Timed intervals replace race distances. Heavy loads are the open-division station standards from the Season 26/27 rulebook; medium and light are training suggestions. Swap stations you lack: a heavy carry for the sled, a treadmill or shuttle for the run."
  equipment:
    - Treadmill or running route
    - SkiErg
    - Sled
    - Rowing machine
    - Kettlebell
    - Sandbag
    - Medicine ball
    - Wall
  participants: 1
  prep: 10s
  sections:
