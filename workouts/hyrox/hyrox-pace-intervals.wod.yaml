format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: hyrox-pace-intervals
  revision: 1
  title: HYROX Pace Intervals
  description: "The race shape at training length: eight three-minute runs, each followed by two minutes on the next station, with thirty seconds to transition. Heavy is the open standard: sled push 152 kg (women 102 kg, incl. sled), sled pull 103 kg (78 kg), farmers carry 2 × 24 kg (2 × 16 kg), sandbag lunges 20 kg (10 kg), wall balls 6 kg (4 kg) to a 3 m (2.7 m) target. Hold the run pace you want on race day and keep the stations steady."
  attribution:
    author: OpenWOD
    sourceUrl: https://hyrox.com/the-fitness-race/
    notes: "A training variation of the published HYROX race structure (8 runs, 8 stations); the format is not an official prescription. Timed intervals replace race distances. Heavy loads are the open-division station standards from the Season 26/27 rulebook; medium and light are training suggestions. Swap stations you lack: a heavy carry for the sled, a treadmill or shuttle for the run."
  equipment:
    - Treadmill or running route
    - SkiErg
    - Sled
    - Rowing machine
    - Kettlebell
    - Sandbag
    - Medicine ball
    - Wall
  participants: 1
  prep: 10s
  sections:
    - id: hyrox-sim
      title: Runs and Stations
      format: timedCircuit
      transitionAfter: manualReady
      body:
        id: hyrox-sim-sequence
        type: sequence
        betweenChildrenRest: 30s
        children:
          - id: hyrox-run-1
            type: timed
            duration: 3m
            assignments:
              A:
                notes: Race pace
                name: Run
          - id: hyrox-skierg
            type: timed
            duration: 2m
            assignments:
              A:
                name: SkiErg
          - id: hyrox-run-2
            type: timed
            duration: 3m
            assignments:
              A:
                notes: Race pace
                name: Run
          - id: hyrox-sled-push
            type: timed
            duration: 2m
            assignments:
              A:
                notes: Total incl. sled; heavy is the open standard
                name: Sled Push
                load:
                  light:
                    value: 70
                    women: 50
                    unit: kg
                  medium:
                    value: 105
                    women: 70
                    unit: kg
                  heavy:
                    value: 152
                    women: 102
                    unit: kg
          - id: hyrox-run-3
            type: timed
            duration: 3m
            assignments:
              A:
                notes: Race pace
                name: Run
          - id: hyrox-sled-pull
            type: timed
            duration: 2m
            assignments:
              A:
                notes: Total incl. sled; heavy is the open standard
                name: Sled Pull
                load:
                  light:
                    value: 50
                    women: 35
                    unit: kg
                  medium:
                    value: 70
                    women: 55
                    unit: kg
                  heavy:
                    value: 103
                    women: 78
                    unit: kg
          - id: hyrox-run-4
            type: timed
            duration: 3m
            assignments:
              A:
                notes: Race pace
                name: Run
          - id: hyrox-burpee-broad-jumps
            type: timed
            duration: 2m
            assignments:
              A:
                name: Burpee Broad Jumps
          - id: hyrox-run-5
            type: timed
            duration: 3m
            assignments:
              A:
                notes: Race pace
                name: Run
          - id: hyrox-row
            type: timed
            duration: 2m
            assignments:
              A:
                name: Row
          - id: hyrox-run-6
            type: timed
            duration: 3m
            assignments:
              A:
                notes: Race pace
                name: Run
          - id: hyrox-farmers-carry
            type: timed
            duration: 2m
            assignments:
              A:
                notes: Per hand; heavy is the open standard
                name: Farmers Carry
                load:
                  light:
                    value: 12
                    women: 8
                    unit: kg
                  medium:
                    value: 16
                    women: 12
                    unit: kg
                  heavy:
                    value: 24
                    women: 16
                    unit: kg
          - id: hyrox-run-7
            type: timed
            duration: 3m
            assignments:
              A:
                notes: Race pace
                name: Run
          - id: hyrox-sandbag-lunges
            type: timed
            duration: 2m
            assignments:
              A:
                notes: Heavy is the open standard (the 10 kg race bag for women); medium is a training step below it
                name: Sandbag Lunges
                load:
                  light:
                    value: 10
                    women: 5
                    unit: kg
                  medium:
                    value: 15
                    women: 7.5
                    unit: kg
                  heavy:
                    value: 20
                    women: 10
                    unit: kg
          - id: hyrox-run-8
            type: timed
            duration: 3m
            assignments:
              A:
                notes: Race pace
                name: Run
          - id: hyrox-wall-balls
            type: timed
            duration: 2m
            assignments:
              A:
                notes: 3 m (2.7 m) target
                name: Wall Balls
                load:
                  light:
                    value: 3
                    women: 2
                    unit: kg
                  medium:
                    value: 4
                    women: 3
                    unit: kg
                  heavy:
                    value: 6
                    women: 4
                    unit: kg
