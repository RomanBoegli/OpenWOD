format: openwod.workout
formatVersion: 3
workout:
  schemaVersion: 2
  id: run-sled-run
  revision: 1
  title: Run, Sled, Run
  description: "One kilometre run, fifty metres of sled push (the race distance, 4 × 12.5 m), one kilometre run. Heavy is the open-division race load, 152 kg for men and 102 kg for women including the sled. Tap Done when a distance is covered; the clock counts up and records each split. No cap: finish what you start."
  attribution:
    author: OpenWOD
    sourceUrl: https://maintain.hyrox.com/rulebooks/HYROX_RulebookDoubles_EN.pdf
    notes: A HYROX-style run and station sequence. Heavy is the open-division sled push standard from the Season 26/27 rulebook (total incl. sled); medium and light are training suggestions.
  equipment:
    - Running route
    - Sled
  participants: 1
  prep: 10s
  sections:
    - id: rsr
      title: Run, sled, run
      format: forTime
      transitionAfter: manualReady
      body:
        id: rsr-sequence
        type: sequence
        children:
          - id: rsr-run-1
            type: task
            assignments:
              A:
                name: Run
                distance:
                  value: 1
                  unit: km
          - id: rsr-sled
            type: task
            assignments:
              A:
                notes: Total incl. sled; heavy is the open standard
                name: Sled Push
                distance:
                  value: 50
                  unit: m
                load:
                  light:
                    value: 70
                    women: 50
                    unit: kg
                  medium:
                    value: 105
                    women: 70
                    unit: kg
                  heavy:
                    value: 152
                    women: 102
                    unit: kg
          - id: rsr-run-2
            type: task
            assignments:
              A:
                name: Run
                distance:
                  value: 1
                  unit: km
